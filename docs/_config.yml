# Jekyll configuration for the AI-SAXS documentation site.
# Published via GitHub Pages from this /docs folder on the main branch.

title: AI-SAXS
description: >-
  AI-SAXS is a differentiable machine-learning framework for fitting
  small-angle X-ray scattering (SAXS) curves from lipid nanoparticles
  and recovering nanoparticle size, internal structure, and size distributions.

# Project page served at https://mariabankestad.github.io/aisaxs/
# baseurl must match the repo name so the theme's CSS and assets resolve.
url: "https://mariabankestad.github.io"
baseurl: "/aisaxs"

# GitHub Pages built-in theme. Cayman gives a clean header banner and
# readable typography for long-form content; no extra plugins needed.
theme: jekyll-theme-cayman

# Maintainer-only notes; not part of the published site.
exclude:
  - README.md
